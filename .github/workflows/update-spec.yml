name: update-spec
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  SPEC_URL: https://api.staging.polivor.com/docs/openapi.yaml

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: curl --fail --silent --show-error --location "$SPEC_URL" --output openapi/polivor.yaml
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-openapi-spec
          commit-message: Update the generated client to the current API description
          title: Update the generated client to the current API description
          body: The published OpenAPI file changed. This regenerates the client from it; review the diff for breaking changes before merging.
